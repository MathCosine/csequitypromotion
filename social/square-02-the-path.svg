<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="From first lesson to founding team: the CS Equity AI path">
<title>From first lesson to founding team: the CS Equity AI path</title>
<rect width="1080" height="1080" fill="#FFF8EE"/>
<text x="80" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-2" >From first lesson</text>
<text x="80" y="260" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="-2" >to founding team.</text>
<rect x="80" y="350" width="920" height="160" rx="26" fill="#FFFFFF" stroke="#E9E3F7" stroke-width="3"/>
