<text x="270" y="408" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="3" >LEVEL 1 · CAPABILITY</text>
<text x="270" y="454" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-1" >Foundation course</text>
<text x="270" y="490" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#3B3870" text-anchor="start" letter-spacing="0" >→ Foundation Certificate</text>
<rect x="80" y="540" width="920" height="160" rx="26" fill="#FFFFFF" stroke="#E9E3F7" stroke-width="3"/>
<text x="120" y="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="0" >ii.</text>
<text x="270" y="598" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="3" >LEVEL 2 · CREATION</text>
<text x="270" y="644" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-1" >Bootcamp</text>
<text x="270" y="680" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#3B3870" text-anchor="start" letter-spacing="0" >→ A working AI system</text>
<rect x="80" y="730" width="920" height="160" rx="26" fill="#FFFFFF" stroke="#E9E3F7" stroke-width="3"/>
