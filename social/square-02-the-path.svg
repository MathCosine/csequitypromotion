<text x="270" y="788" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="3" >LEVEL 3 · CAPITAL</text>
