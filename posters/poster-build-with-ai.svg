<text x="255" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-1" >CS Equity AI</text>
<text x="257" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >501(c)(3) public charity · since 2021</text>
<text x="120" y="560" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-3" >We teach students</text>
<text x="120" y="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-3" >to build with AI,</text>
<text x="120" y="840" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="-3" >not just use it.</text>
<text x="120" y="1090" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="230" font-weight="800" fill="#14B8A6" text-anchor="start" letter-spacing="-6" >Free.</text>
<text x="124" y="1200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >Live online courses taught by engineers from Google and</text>
<text x="124" y="1260" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >academia, for students in the US, Taiwan and Hong Kong.</text>
<text x="124" y="1320" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >No tuition. You need a browser and some curiosity.</text>
<rect y="1420" width="1800" height="600" fill="#1E1B4B"/>
<text x="120" y="1515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFF8EE" text-anchor="start" letter-spacing="-1" >How it works</text>
<text x="470" y="1515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#A5B4FC" text-anchor="start" letter-spacing="0" >Each level ends with something real.</text>
<text x="120" y="1650" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="0" >i.</text>
<text x="120" y="1712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="3" >LEVEL 1 · CAPABILITY</text>
<text x="120" y="1770" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFF8EE" text-anchor="start" letter-spacing="-1" >Foundation course</text>
<text x="120" y="1822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#A5B4FC" text-anchor="start" letter-spacing="0" >Self-paced, in the browser</text>
<text x="120" y="1905" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="0" >→ Foundation Certificate</text>
<text x="660" y="1650" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="0" >ii.</text>
<text x="660" y="1712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="3" >LEVEL 2 · CREATION</text>
<text x="660" y="1770" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFF8EE" text-anchor="start" letter-spacing="-1" >Bootcamp</text>
<text x="660" y="1822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#A5B4FC" text-anchor="start" letter-spacing="0" >Weekly live sessions,</text>
<text x="660" y="1862" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#A5B4FC" text-anchor="start" letter-spacing="0" >small teams</text>
<text x="660" y="1905" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="0" >→ A working AI system</text>
<text x="1200" y="1650" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="0" >iii.</text>
<text x="1200" y="1712" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="3" >LEVEL 3 · CAPITAL</text>
<text x="1200" y="1770" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFF8EE" text-anchor="start" letter-spacing="-1" >Startup</text>
<text x="1200" y="1822" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#A5B4FC" text-anchor="start" letter-spacing="0" >Founding team of</text>
<text x="1200" y="1862" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#A5B4FC" text-anchor="start" letter-spacing="0" >three to five</text>
<text x="1200" y="1905" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="0" >→ Pitch to angel investors</text>
<text x="120" y="1990" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#A5B4FC" text-anchor="start" letter-spacing="0" font-style="italic">Finishing one level is how you get into the next.</text>
<text x="120" y="2150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#1E1B4B" text-anchor="start" letter-spacing="-1" >Start with the free Foundation course.</text>
<text x="122" y="2210" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >It’s open now, and it’s how students get onto the</text>
<text x="122" y="2254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >roster for the Fall 2026 course.</text>
<text x="120" y="2340" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#FF6B5B" text-anchor="start" letter-spacing="-1" >csequityai.org</text>
