<text x="124" y="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#3B3870" text-anchor="start" letter-spacing="0" >Six of the AI systems shipped by teams in our last course,</text>
